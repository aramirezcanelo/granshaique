<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Error del servidor · Gran Chaique</title>
  <link rel="stylesheet" href="/public/static/error.css?v=1">
</head>
<body>
  <main class="error-card">
    <div class="error-brand"><span class="error-mark">G</span> GRAN CHAIQUE</div>
    <div class="error-symbol" aria-hidden="true">✦</div>
    <p class="error-code" aria-label="Error 500">500</p>
    <h1>Tuvimos un problema interno</h1>
    <p class="error-copy">El servidor no pudo completar la solicitud. Tus datos se mantienen protegidos; intenta de nuevo en un momento.</p>
    <div class="error-actions"><a class="error-button primary" href="/">Ir al inicio</a><a class="error-button" href="">Reintentar</a></div>
    <p class="error-hint">Si el problema continúa, comparte el código 500 con el administrador.</p>
  </main>
</body>
</html>
