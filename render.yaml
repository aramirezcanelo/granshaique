services:
  - type: web
    name: gran-chaique
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node --env-file-if-exists=.env dist/server/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: NODE_ENV
        value: production
      - key: APP_TIME_ZONE
        value: America/Mexico_City
      - key: DATA_DIR
        value: /var/data
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: gran-chaique-data
      mountPath: /var/data
      sizeGB: 1
